name: Radar Mercado Publico

on:
  schedule:
    - cron: "0 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    env:
      MAIL_TO: ${{ secrets.MAIL_TO }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Recuperar cache de fichas
        uses: actions/cache@v4
        with:
          path: data/cache
          key: fichas-${{ github.run_id }}
          restore-keys: fichas-

      - name: Ejecutar radar
        env:
          MP_TICKET: ${{ secrets.MP_TICKET }}
        run: python radar.py

      - name: Publicar resultados
        run: |
          git config user.name  "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/latest.json data/informe.html data/vistos.json data/historial
          git diff --staged --quiet || git commit -m "radar $(date -u +%F)"
          git push

      - name: Guardar informe descargable
        uses: actions/upload-artifact@v4
        with:
          name: informe-${{ github.run_id }}
          path: data/informe.html
          retention-days: 30

      - name: Preparar correo
        if: env.MAIL_TO != ''
        run: python armar_correo.py

      - name: Enviar informe por correo
        if: env.MAIL_TO != '' && hashFiles('correo.html') != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: ${{ secrets.MAIL_USER }}
          password: ${{ secrets.MAIL_PASS }}
          from: Radar Mercado Publico
          to: ${{ secrets.MAIL_TO }}
          cc: ${{ secrets.MAIL_CC }}
          subject: ${{ env.ASUNTO }}
          html_body: file://correo.html
          attachments: data/informe.html
          convert_markdown: false
