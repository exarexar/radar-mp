name: Radar Mercado Publico

on:
  schedule:
    - cron: "30 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Ejecutar radar
        env:
          MP_TICKET: ${{ secrets.MP_TICKET }}
        run: python radar.py --dias 2

      - name: Publicar resultados
        run: |
          git config user.name  "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/latest.json data/informe.html data/historial
          git diff --staged --quiet || git commit -m "radar $(date -u +%F)"
          git push

      - name: Guardar informe descargable
        uses: actions/upload-artifact@v4
        with:
          name: informe-${{ github.run_id }}
          path: data/informe.html
          retention-days: 30
